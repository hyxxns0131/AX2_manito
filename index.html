<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>우리 팀 마니또</title>
  <link rel="icon" href="assets/icons/heart.svg?v=1.3.0" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Noto+Sans+KR:wght@400;700&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@2.40.3/dist/galmuri.css">
  <link rel="stylesheet" href="css/base.css?v=1.3.0">
  <link rel="stylesheet" href="css/components.css?v=1.3.0">
  <link rel="stylesheet" href="css/pages.css?v=1.3.0">
</head>
<body class="page-login">
  <!-- 방 꾸미기 (장식) -->
  <div class="room" aria-hidden="true">
    <div class="poster poster-l"><b>AX2</b><span>♡ TEAM ♡</span></div>
    <div class="poster poster-r"><b>SECRET</b><span>manito club</span></div>
    <span class="sparkle sp1">✦</span>
    <span class="sparkle sp2">✧</span>
    <span class="sparkle sp3">✦</span>
    <span class="sparkle sp4">✧</span>
  </div>

  <form id="login-form" class="desk" autocomplete="off">
    <div class="monitor">
      <div class="crt">
        <div class="liquid" aria-hidden="true"></div>
        <div class="crt-content">
          <div class="os-window">
            <div class="os-bar" aria-hidden="true"><span>✿ manito.exe</span><span>─ □ ✕</span></div>
            <div class="os-body">
              <h1 class="logo">마니또<span class="logo-heart">♥</span></h1>
              <p class="logo-sub">AX2 TEAM · SECRET CLUB</p>

              <label class="field">
                <span class="field-label">이름</span>
                <select id="name" required>
                  <option value="">♡ 내 이름 고르기</option>
                </select>
              </label>
              <label class="field">
                <span class="field-label">개인 코드 <small>키보드로 쳐도 돼요</small></span>
                <input id="code" type="text" inputmode="numeric" spellcheck="false"
                       placeholder="● ● ● ● ● ●" autocapitalize="characters" required>
              </label>
              <p id="login-error" class="error" role="alert" hidden></p>
              <button class="btn btn-primary btn-block" type="submit">♡ 입장하기</button>
            </div>
          </div>
        </div>
      </div>
      <div class="bezel" aria-hidden="true">
        <i class="b-heart"></i><i class="b-heart sm"></i><i class="b-heart"></i><i class="b-star"></i>
        <span class="brand">MANITO-98 · v1.3.0</span>
        <i class="b-star"></i><i class="b-heart"></i><i class="b-heart lg"></i><i class="b-heart sm"></i>
      </div>
    </div>
    <div class="stand" aria-hidden="true"><i></i></div>

    <div class="keyboard" data-keyboard aria-label="코드 입력 키보드"></div>

    <a class="sticky-note" href="admin.html">관리자<br>페이지 →</a>
    <img class="desk-heart" src="assets/icons/heart.svg?v=1.3.0" alt="" width="64" height="64">
    <img class="desk-star" src="assets/icons/star.svg?v=1.3.0" alt="" width="64" height="64">
  </form>

  <!-- 액체 화면 필터 -->
  <svg class="svg-defs" aria-hidden="true" width="0" height="0">
    <filter id="liquid" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.011 0.016" numOctaves="2" seed="7">
        <animate attributeName="baseFrequency" dur="16s" repeatCount="indefinite"
                 values="0.011 0.016;0.016 0.011;0.011 0.016"/>
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" scale="70"/>
    </filter>
  </svg>

  <script src="js/motion.js?v=1.3.0"></script>
  <script src="js/participants.js?v=1.3.0"></script>
  <script src="js/store.js?v=1.3.0"></script>
  <script src="js/auth.js?v=1.3.0"></script>
</body>
</html>
