<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>우리 팀 마니또</title>
  <link rel="icon" href="assets/icons/gift.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body class="page-login">
  <main class="wrap wrap-narrow">
    <header class="hero">
      <img class="hero-icon" src="assets/icons/gift.svg" alt="" width="96" height="96">
      <h1>우리 팀 마니또</h1>
      <p>내 코드로 들어와서 비밀 친구를 확인해요</p>
    </header>

    <form id="login-form" class="card" autocomplete="off">
      <label class="field">
        <span class="field-label">이름</span>
        <select id="name" required>
          <option value="">이름을 선택하세요</option>
        </select>
      </label>
      <label class="field">
        <span class="field-label">개인 코드</span>
        <input id="code" type="text" inputmode="text" minlength="4" maxlength="6"
               placeholder="받은 코드 입력" autocapitalize="characters" required>
      </label>
      <p id="login-error" class="error" role="alert" hidden></p>
      <div class="sticky-action">
        <button class="btn btn-primary btn-block" type="submit">입장하기</button>
      </div>
    </form>

    <p class="footer-link"><a href="admin.html">관리자</a></p>
  </main>
  <script src="js/participants.js"></script>
  <script src="js/store.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
